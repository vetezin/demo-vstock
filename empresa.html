<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Buscar Empresa | Plataforma de Gestão</title>

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
  <link rel="stylesheet" href="css/style.css" />
  <link rel="stylesheet" href="css/empresa.css" />
</head>
<body>

  <div class="buscar-container">
    <h1><i class="bi bi-search"></i> Buscar Empresa</h1>
    <p class="buscar-subtitle">Localize a configuracao da empresa para continuar o acesso.</p>

    <form id="empresaForm">
      <div class="mb-3">
        <label for="emailEmpresa" class="form-label">E-mail da Empresa</label>
        <input type="email" id="emailEmpresa" name="emailEmpresa" class="form-control" required />
      </div>
      <button type="submit" class="btn btn-buscar">Buscar</button>
    </form>

    <div id="empresaResultado" class="card p-3 mt-4">
      <div id="logoEmpresa" class="text-center"></div>
      <div id="dadosEmpresa" class="mt-3"></div>
    </div>

    <div id="msg" class="text-success mt-3"></div>
    <div id="error" class="text-danger mt-2"></div>
  </div>

  <script src="js/mock-api.js?v=dashboard-direct"></script>
<script src="js/principal.js?v=2314428"></script>
  <script src="js/empresa.js"></script>
</body>
</html>
