<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Buscar Empresa | Plataforma de Gestão</title>

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
  <link rel="stylesheet" href="css/style.css" />
  <link rel="stylesheet" href="css/empresa.css" />
  <link rel="stylesheet" href="css/visual-completo.css?v=1"/>
  <link rel="stylesheet" href="css/empresa-visual.css" />
</head>
<body class="vstock-refresh vstock-access">

  <div class="buscar-container vstock-access-shell">
    <header class="vstock-access-brand" aria-label="Marca VStock">
      <img src="assets/branding/logo-sistema-vstock-original.png" alt="VStock" class="vstock-access-logo" />
      <p class="vstock-access-kicker">Acesso à empresa</p>
      <h1 class="vstock-access-title">Buscar empresa</h1>
      <p class="buscar-subtitle">Informe o e-mail para localizar a configuração e continuar o acesso.</p>
    </header>

    <form id="empresaForm" class="vstock-access-form">
      <div class="mb-3 vstock-field-group">
        <label for="emailEmpresa" class="form-label">E-mail da empresa</label>
        <input type="email" id="emailEmpresa" name="emailEmpresa" class="form-control" required autocomplete="email" inputmode="email" placeholder="empresa@exemplo.com" />
        <div id="error" class="text-danger mt-2 vstock-field-error" role="status" aria-live="polite"></div>
        <div id="msg" class="text-success mt-2 vstock-field-msg" role="status" aria-live="polite"></div>
      </div>
      <button type="submit" class="btn btn-buscar">Buscar empresa</button>
    </form>

    <div id="empresaResultado" class="card p-3 mt-4 vstock-ficha vs-panel" data-ficha="true">
      <p class="vstock-ficha-label">Ficha da empresa</p>
      <div id="logoEmpresa" class="text-center"></div>
      <div id="dadosEmpresa" class="mt-3"></div>
    </div>
  </div>

  <script src="js/mock-api.js?v=frontend-audit"></script>
  <script src="js/principal.js"></script>
  <script src="js/empresa.js"></script>
</body>
</html>
