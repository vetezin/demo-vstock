<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Veículos da Oficina | Plataforma de Gestão</title>

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css" rel="stylesheet" />
  <link href="css/style.css" rel="stylesheet" />
  <link href="css/app.css" rel="stylesheet" />
  <link href="css/principal.css?v=20260829-orcamentos-menu" rel="stylesheet" />
  <link href="css/cadastro-base.css" rel="stylesheet" />
</head>
<body class="app-shell">
  <nav class="navbar brand-navbar app-topbar">
    <div class="container-fluid justify-content-between">
      <a class="navbar-brand text-white d-flex align-items-center gap-2 text-decoration-none" href="index.html">
        <img alt="Logo da plataforma" class="logo" src="larSantaFilomena.png" />
      </a>

      <div class="text-white text-end">
        <div class="navbar-date">
          <i class="bi bi-calendar3"></i>
          <span id="current-date"></span>
        </div>
      </div>
    </div>
  </nav>

  <div class="main-container app-layout">
    <aside class="sidebar">
      <h5><i class="bi bi-grid-3x3-gap"></i> Módulos do Sistema</h5>
    </aside>

    <main class="content page-content">
      <div id="mensagens" class="mb-3" aria-live="polite"></div>

      <div class="page-header">
        <div class="page-header-title-center">
          <h2><i class="bi bi-bicycle text-danger"></i> Veículos da Oficina</h2>
          <p class="text-muted mb-0">Cadastre as motos dos clientes para utilizá-las nos orçamentos e ordens de serviço.</p>
        </div>
        <a href="index.html" class="btn btn-outline-secondary">
          <i class="bi bi-arrow-left"></i> Voltar para Dashboard
        </a>
      </div>

      <section class="card simple-card mb-4" aria-labelledby="tituloFormularioVeiculo">
        <div class="card-header">
          <span id="tituloFormularioVeiculo"><i class="bi bi-plus-circle"></i> Novo veículo</span>
        </div>
        <div class="card-body">
          <form id="veiculoForm" class="row g-3">
            <div class="col-md-6">
              <label class="form-label required" for="clienteNome">Cliente</label>
              <div class="input-group"><input id="clienteNome" class="form-control" type="text" required autocomplete="off" placeholder="Selecione ou pesquise o cliente" /><button id="btnNovoClienteRapido" class="btn btn-outline-primary btn-inline-icon" type="button" title="Cadastrar cliente" aria-label="Cadastrar cliente"><i class="bi bi-plus-circle"></i></button></div>
              <input id="clienteId" type="hidden" />
              <small class="text-muted">Apenas clientes ativos podem receber veículos.</small>
            </div>

            <div class="col-md-3">
              <label class="form-label required" for="placa">Placa</label>
              <input id="placa" class="form-control text-uppercase" type="text" placeholder="ABC1D23" required maxlength="7" autocomplete="off" />
            </div>

            <div class="col-md-3">
              <label class="form-label" for="anoFabricacao">Ano de fabricação</label>
              <input id="anoFabricacao" class="form-control" type="number" min="1900" max="2100" placeholder="Ex.: 2024" />
            </div>

            <div class="col-md-4">
              <label class="form-label required" for="marca">Marca</label>
              <input id="marca" class="form-control" type="text" placeholder="Ex.: Honda" required maxlength="80" />
            </div>

            <div class="col-md-5">
              <label class="form-label required" for="modelo">Modelo</label>
              <input id="modelo" class="form-control" type="text" placeholder="Ex.: CG 160 Fan" required maxlength="120" />
            </div>

            <div class="col-md-3">
              <label class="form-label" for="cor">Cor</label>
              <input id="cor" class="form-control" type="text" placeholder="Ex.: Vermelha" maxlength="40" />
            </div>

            <div class="col-12">
              <label class="form-label" for="observacao">Observação</label>
              <textarea id="observacao" class="form-control" rows="3" maxlength="1000" placeholder="Informações úteis sobre o veículo"></textarea>
            </div>

            <div class="col-12 d-flex justify-content-end gap-2 flex-wrap">
              <button type="button" id="btnCancelarEdicao" class="btn btn-outline-secondary d-none">
                <i class="bi bi-x-circle"></i> Cancelar edição
              </button>
              <button type="button" id="btnLimpar" class="btn btn-outline-warning">
                <i class="bi bi-eraser"></i> Limpar
              </button>
              <button type="submit" id="btnSalvarVeiculo" class="btn btn-success">
                <i class="bi bi-check2-circle"></i> Salvar veículo
              </button>
            </div>
          </form>
        </div>
      </section>

      <section class="card simple-card" aria-labelledby="tituloListaVeiculos">
        <div class="card-header">
          <span id="tituloListaVeiculos"><i class="bi bi-list-ul"></i> Veículos cadastrados</span>
        </div>
        <div class="card-body">
          <div class="cadastro-toolbar mb-3">
            <div class="cadastro-filtro">
              <label class="form-label" for="filtroVeiculo">Buscar por placa, marca ou modelo</label>
              <input id="filtroVeiculo" class="form-control" type="search" placeholder="Digite para filtrar" />
            </div>
            <div class="cadastro-filtro">
              <label class="form-label" for="filtroCliente">Filtrar por cliente</label>
              <input id="filtroCliente" class="form-control" type="search" placeholder="Digite o nome do cliente" />
            </div>
            <div class="cadastro-filtro" style="max-width: 190px;">
              <label class="form-label" for="filtroStatus">Status</label>
              <select id="filtroStatus" class="form-select">
                <option value="todos">Todos</option>
                <option value="ativos">Ativos</option>
                <option value="inativos">Inativos</option>
              </select>
            </div>
          </div>

          <div class="table-responsive">
            <table class="table table-hover align-middle" id="tabelaVeiculos">
              <thead>
                <tr>
                  <th>Placa</th>
                  <th>Veículo</th>
                  <th>Cliente</th>
                  <th>Ano</th>
                  <th>Cor</th>
                  <th>Status</th>
                  <th class="text-center">Ações</th>
                </tr>
              </thead>
              <tbody></tbody>
            </table>
          </div>

          <div id="paginacaoVeiculos" class="paginacao-cadastro"></div>
        </div>
      </section>
    </main>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/mock-api.js?v=frontend-audit-oficina"></script>
    <script src="js/principal.js"></script>
  <script src="js/cadastro-rapido.js"></script>
  <script src="js/cadastro-oficina-veiculos.js"></script>
</body>
</html>
