<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Login | Plataforma de Gestão</title>

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
  <link rel="stylesheet" href="css/style.css" />
  <link rel="stylesheet" href="css/login.css" />
</head>
<body>

  <div class="login-container">
    <div class="login-badge">
      <i class="bi bi-box-arrow-in-right"></i>
    </div>
    <h1>Acesso da Equipe</h1>
    <p class="login-subtitle">Entre para continuar a gestão do estoque e das operações.</p>

    <form id="loginForm">
      <div class="mb-3 text-start">
        <label for="email" class="form-label">E-mail</label>
        <input type="email" id="email" name="email" class="form-control" required />
      </div>

      <div class="mb-3 text-start">
        <label for="senha" class="form-label">Senha</label>
        <input type="password" id="senha" name="senha" class="form-control" required />
      </div>

      <div id="licencaFieldWrapper" class="mb-3 text-start" style="display: none;">
        <label for="licenca" class="form-label">Chave de Liberação</label>
        <input
          type="text"
          id="licenca"
          name="licenca"
          class="form-control"
          placeholder="Informe a chave fornecida"
          autocomplete="off"
        />
        <div id="licencaHelper" class="form-text"></div>
      </div>

      <button type="submit" class="btn btn-login">Entrar</button>
    </form>

    <div id="msg" class="text-success"></div>
    <div id="error" class="text-danger"></div>
  </div><script src="js/mock-api.js"></script>
<script src="js/mock-api.js"></script>
<script src="js/principal.js"></script>
<script src="js/login.js"></script>
</body>
</html>
