<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Login | Plataforma de Gestão</title>

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
  <link rel="stylesheet" href="css/style.css" />
  <link rel="stylesheet" href="css/login.css" />
</head>
<body>
  <main class="login-shell">
    <section class="login-panel login-panel-single">
      <div class="login-container">
        <div class="login-badge">
          <i class="bi bi-box-arrow-in-right"></i>
        </div>
        <span class="login-overline">Acesso da equipe</span>
        <h1>Bem-vindo de volta</h1>
        <p class="login-subtitle">Entre com suas credenciais para continuar a operacao do sistema.</p>

        <form id="loginForm">
          <div class="mb-3 text-start field-group">
            <label for="acesso" class="form-label">Usuário ou e-mail</label>
            <div class="input-shell">
              <span class="input-icon" aria-hidden="true">
                <i class="bi bi-person"></i>
              </span>
              <input type="text" id="acesso" name="acesso" class="form-control" placeholder="seu.usuario ou seu@email.com" required autocomplete="username" />
            </div>
          </div>

          <div class="mb-3 text-start field-group">
            <label for="senha" class="form-label">Senha</label>
            <div class="input-shell">
              <span class="input-icon" aria-hidden="true">
                <i class="bi bi-lock"></i>
              </span>
              <input type="password" id="senha" name="senha" class="form-control" placeholder="Digite sua senha" required />
            </div>
          </div>

          <div id="licencaFieldWrapper" class="mb-3 text-start field-group" style="display: none;">
            <label for="licenca" class="form-label">Chave de Liberacao</label>
            <div class="input-shell">
              <span class="input-icon" aria-hidden="true">
                <i class="bi bi-key"></i>
              </span>
              <input
                type="text"
                id="licenca"
                name="licenca"
                class="form-control"
                placeholder="Informe a chave fornecida"
                autocomplete="off"
              />
            </div>
            <div id="licencaHelper" class="form-text"></div>
          </div>

          <button type="submit" class="btn btn-login">Entrar no sistema</button>
        </form>

        <div class="feedback-stack" aria-live="polite">
          <div id="msg" class="status-feedback status-success"></div>
          <div id="error" class="status-feedback status-error"></div>
        </div>
      </div>
    </section>
  </main>

  <script src="js/mock-api.js?v=dashboard-direct"></script>
<script src="js/principal.js"></script>
  <script src="js/login.js"></script>
</body>
</html>
